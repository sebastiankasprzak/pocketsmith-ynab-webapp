name: Deploy to Staging

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run tests
      run: npm run test:ci
      
    - name: Build for staging
      run: npm run build
      env:
        VITE_ENVIRONMENT: staging
        VITE_API_BASE_URL: ${{ secrets.STAGING_API_BASE_URL }}
        VITE_AWS_REGION: ${{ secrets.AWS_REGION }}
        VITE_COGNITO_USER_POOL_ID: ${{ secrets.STAGING_COGNITO_USER_POOL_ID }}
        VITE_COGNITO_USER_POOL_CLIENT_ID: ${{ secrets.STAGING_COGNITO_CLIENT_ID }}
        
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}
        
    - name: Deploy infrastructure to staging
      run: |
        cd ../infrastructure
        npm ci
        npx cdk deploy --require-approval never --context environment=staging
        
    - name: Deploy webapp to S3
      run: |
        aws s3 sync dist/ s3://${{ secrets.STAGING_S3_BUCKET }} --delete
        
    - name: Invalidate CloudFront cache
      run: |
        aws cloudfront create-invalidation --distribution-id ${{ secrets.STAGING_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
        
    - name: Run smoke tests
      run: npm run test:e2e:staging
      env:
        STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
        
    - name: Notify deployment status
      if: always()
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        channel: '#deployments'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        text: 'Staging deployment ${{ job.status }}: ${{ github.event.head_commit.message }}'